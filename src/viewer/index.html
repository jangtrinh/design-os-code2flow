<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Code2Flow</title><link rel="stylesheet" href="./viewer.css"></head><body><header aria-label="Canvas controls"><div class="toolbar" id="toolbar-left"><h1 id="product">Code2Flow</h1><div class="crumb" id="crumb"></div></div><div class="toolbar" id="toolbar-right"><button class="nav-search" id="nav-search" aria-label="Search" title="Search"><span>Search</span></button><button class="icon-btn" id="canvas-help" aria-label="Canvas vocabulary" title="Canvas vocabulary"></button><div class="seg" id="modeSeg"><button data-mode="inspect">Inspect</button><button data-mode="present">Present</button><button data-mode="play">Play</button></div><div id="canvas-help-popover" hidden></div></div></header><aside class="rail" id="rail"></aside><div id="stage"><svg id="svg" role="img" aria-label="Flow pages"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g id="view"></g></svg><div class="presenter-hud" id="phud" hidden></div><div id="player" hidden></div></div><div id="palette" hidden><div class="box"><input id="palette-input" type="search" placeholder="Search" aria-label="Search" autocomplete="off"><ul class="results" id="palette-results" role="listbox" aria-label="Results"></ul></div></div><div id="lightbox" hidden><div class="scroller"><img alt="Full-size screenshot" width="1440" height="900" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><p class="image-fallback" hidden>Screenshot unavailable</p></div><div class="caption"></div></div><div id="drawer"><div class="inner" id="drawer-body"></div></div><script type="module" src="./viewer.js"></script></body></html>
